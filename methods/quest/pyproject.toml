[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest"
version = "0.0.1"

dependencies = [
    "transformers==4.57.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
quest = ["ops/native_batch/CMakeLists.txt",
         "ops/native_batch/csrc/*.cpp", "ops/native_batch/csrc/*.cu",
         "ops/native_batch/csrc/*.h", "ops/native_batch/include/decode/*.cuh",
         "ops/native_batch/include/prefill/*.cuh", "ops/native_batch/include/topk/*.cuh"]
